[[apps]]
name = "Nicholas Rui"
year = 2025
category = "Stellar Physics"
title = "A seismic atlas of the stellar merger sky"
flavor = "Hubble"
institution_phd = "California Institute of Technology"
institution_host = "Princeton University"
abstract = "Stellar mergers are common but poorly understood processes. Owing to its sensitivity to internal stellar properties, asteroseismology is uniquely capable of discovering merger remnant stars that appear superficially normal. Red giants' rich pulsation spectra, strong coupling to core oscillations, and high rates of interaction make them optimal targets for seismic searches of past mergers. The hundreds of thousands of red giants measured by TESS and Roman will revolutionize these searches by building large enough seismic samples of merger remnants to probe the statistics of the mergers themselves. As a Hubble Fellow, I will model the seismic properties of a diverse zoo of red giant merger remnant stars. By comparing TESS and Roman catalogs to synthetic populations from next-generation binary population codes, I will extract the intrinsic rates of various types of stellar mergers."
url = "https://drive.google.com/file/d/17VsxMDhpDdEFs1QKKjo-TA5g1VpvLSb2"

[[apps]]
name = "Lindsey Kwok"
year = 2025
category = "Stellar Physics"
title = "Determining the Astrophysical Origins of White-Dwarf Supernovae with JWST Infrared Spectroscopy"
flavor = "Hubble"
institution_phd = "Rutgers University"
institution_host = "Northwestern University"
abstract = "Type Ia supernovae (SN Ia) are thermonuclear explosions of white dwarfs (WD) with far-reaching implications for cosmology, stellar evolution, galactic feedback, and the origin of the elements. Despite their outsized impact and decades of research on optical data, we lack a detailed understanding of the progenitor and explosion scenarios that give rise to both normal SN Ia and the growing population of peculiar white-dwarf supernova (WDSN) subclasses. Recently, JWST opened a new window to the mid-infrared (MIR), where isolated spectral lines from previously inaccessible elements and ions are decisively distinguishing between progenitor and explosion models. As a NASA Hubble Fellow, I will investigate the previously unexplored MIR evolution of both normal and peculiar WDSN from early to late times using upcoming data from my JWST program (GO 5232; PI: Kwok). I will unveil their panchromatic (optical+NIR+MIR) spectral evolution to constrain their ejecta properties and strongly test models for their origins. With the growing sample of JWST WDSN observations, I will correlate their MIR spectral signatures with optical properties to gain novel insights from the population as a whole. My proposed research will leverage the power of JWST to illuminate the astrophysical origins of WDSN throughout the thermonuclear zoo."
url = "https://drive.google.com/file/d/1G6zKNxKBe550FU6R04_WQdQvOK7QkBr8"

