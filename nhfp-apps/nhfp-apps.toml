abstract = "Clouds and hazes dramatically alter the observed properties of exoplanet atmospheres seen in transmission and emission, just as they sculpt the thermal emission spectra of more massive brown dwarfs. I will conduct an intensive observational study of clouds and hazes in nearby exoplanets and brown dwarfs. The main components will be: (1) a Large HST/STIS survey for Rayleigh Scattering hazes in known super-Earths; (2) followup transit observations of newly-discovered planets; (3) eclipse mapping with Spitzer and HST/WFC3 to chart the day sides of hot Jupiters; and (4) Doppler Imaging of cloudy brown dwarfs to produce global 2D maps of multiple chemical species."
