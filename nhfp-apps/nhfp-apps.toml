[[apps]]
name = "Justin Pierel"
year = 2023
category = "Physics and Cosmology"
title = "Leveraging HST for a New Era of Precision NIR SN Ia Cosmology"
flavor = "Einstein"
institution_phd = "University of Southern Carolina"
institution_host = "Space Telescope Science Institute"
abstract = "Near-infrared (NIR) observations from the Nancy Grace Roman Space Telescope will help to unravel the mysteries of dark energy. Type Ia supernovae (SN Ia) will be one of the principal anchors of the Roman cosmology program, requiring a model of SN Ia light curve evolution used to make corrections to the observed SN brightness and thereby infer a luminosity distance. Such corrections take into account, among other variables, that less luminous SN Ia are cooler and therefore appear redder. Unfortunately, this relationship is confounded by dust, which also produces fainter and redder objects, making it extremely difficult to correctly infer intrinsic SN Ia color, and thus luminosity. The consequence is one of the largest systematic uncertainties for SN Ia dark energy measurements today. Fortunately, Roman will be observing at rest-frame NIR wavelengths, where SN Ia are better standard candles and the impact of dust is extremely small. However, my work only recently trained the industry-standard model for SN Ia standardization (SALT3) at NIR wavelengths, so our understanding of NIR SN Ia cosmology is severely limited. As a Hubble Fellow, I will use my new model (SALT3-NIR) to make the first HST WFC3/IR-only measurement of the dark energy equation of state parameter, w. This work will significantly improve calibration and dust-related uncertainties compared to the optical and provide the first analysis of systematics/best practices for NIR SN Ia cosmology, which I will use to re-optimize the Roman survey for rest-frame optical+NIR."
url = "https://drive.google.com/file/d/1J2EPCPlKGDGqQz0Gd4skq48bDjNzp_SQ"

[[apps]]
name = "Adina Feinstein"
year = 2023
category = "Exoplanets and Habitability"
title = "The Evolution of Young Exoplanet Atmospheres in the Presence of Extreme Stellar Activity"
flavor = "Sagan"
institution_phd = "University of Chicago"
institution_host = "University of Colorado Boulder"
abstract = "Detecting and characterizing young planetary systems ($<100\\,\\mathrm{Myr}$) is essential for piecing together questions of how planets evolve, as they are a means for looking back in time to the progenitors of the older planet population. However, planets do not evolve in quiet environments. Young stars are known to have increased magnetic activity which manifests as stellar flares. It is currently unknown how flares shape the atmospheric mass-loss rates of young transiting exoplanets. I propose to study young planets and stars to understand how the early stages of planet evolution are shaped by flares. First, I will propose for novel JWST observations of young transiting exoplanets to constrain their original formation locations. Second, I will use archival HST Far-Ultraviolet (FUV) observations of young stars to constrain FUV flare rates. Third, I will use archival TESS observations of young stars to measure stellar activity cycle timescales. The results of the flare projects will be used as priors for theoretical models of atmospheric mass-loss. As a Hubble Fellow, I will implement a program that approaches this question from stellar, exoplanet, and solar astrophysics perspectives. Only by connecting these fields can we truly begin to understand the early evolution of young exoplanets."
url = "https://drive.google.com/file/d/1xzn8S2KXesOKA-ftGXkWxOXHqYZu3trJ"

