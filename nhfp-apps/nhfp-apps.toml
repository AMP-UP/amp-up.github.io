[[apps]]
name = "Kevin Wagner"
year = 2020
category = "Exoplanets and Habitability"
title = "A New Era of Exoplanet Imaging Mid-Infrared Exploration of the Habitable Zones of Nearby Stars"
flavor = "Sagan"
institution_phd = "University of Arizona"
institution_host = "University of Arizona"
abstract = "Earth-sized exoplanets have been discovered through indirect observations, while direct imaging has enabled the discoveries of roughly a dozen wide-orbit giant planets. For bright nearby stars, the habitable zones overlap with background-limited sensitivity regions of current large telescopes-enabling an exciting opportunity to bridge the gap and to directly image nearby, potentially habitable planets in long exposures. With the current sensitivity, we can possibly observe habitable-zone super-Earths around the nearest stars, and, with continued progress, my aim is to directly observe the most challenging and exciting targets: exo-Earths. As a NASA Hubble Postdoctoral Fellow, I will first work to more than double the sensitivity of mid-infrared exoplanet imaging by developing new instrumental upgrades. Second, I will utilize this performance gain to conduct a novel direct imaging survey for habitable-zone giant planets around ten nearby stars. Third, I will demonstrate a very deep exposure that will be sensitive to sub-Neptune-sized planets. Finally, I will explore building upon these developments with a conceptual design of a future instrument for the Giant Magellan Telescope (GMT), which will enable imaging many more low-mass planets around more distant stars."
url = "https://drive.google.com/file/d/1-sTiJaWwR5442nqab2vukt6e7Huw-o0W"

[[apps]]
name = "David Martin"
year = 2020
category = "Exoplanets and Habitability"
title = "Two Projects with Circumbinary Planets—Using the Planets to Solve Super-Earth Formation, and the Binaries to Empirically Constrain M-dwarfs"
flavor = "Sagan"
institution_phd = "University of Geneva"
institution_host = "The Ohio State University"
abstract = "The Kepler mission has yielded two particularly revolutionary results. First, there is a plentiful abundance of Earth and super-Earth sized exoplanets. Second, we have uncovered planets orbiting two stars - circumbinary planets - which possess advantageous observational properties and provide a unique probe of planet formation. However, these two results remain mutually exclusive; no circumbinary planet has been discovered smaller than 3 Earth radii, owing to the insensitivity of searches. As a Hubble fellow I conduct a two-part project. First, I will create and implement sophisticated automated techniques to discover roughly 50 circumbinary Earths and super-Earths transiting Kepler binaries, and potentially more in TESS. Many will have habitable orbits comparable to the inner Solar System. Enhanced circumbinary transit probabilities mean that the stars will be amongst the brightest known to host transiting planets, making these pristine candidates for atmospheric characterisation. I will tap this previously hidden gold mine in the Kepler data, and provide a necessary development for TESS. The second part of my fellowship will be to interpret this plethora of new results to develop revolutionary comparative planetary formation models, and leave a legacy of both targets and techniques for future instruments such as JWST and PLATO."
url = "https://drive.google.com/file/d/1TD8yjopoE3iK1ff9xThxgoZvTmL1lQ7h"

