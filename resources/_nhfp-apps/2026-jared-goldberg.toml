title = "Massive stars, Inside and Out: Bridging 1D and 3D models of Stars and Supernovae"
science_category = "Stellar Physics"
abstract = '''
Massive stars ($\gtrsim10M_\odot$) are central to nearly all of astrophysics, through their dynamic lives and often-explosive ends. While a star’s deep interior properties determine its fate, its highly-variable outer envelope mediates everything we observe. With the abundance of data from time-domain NASA missions including TESS, UVEX, and ULTRASAT, and wide-field instruments such as Roman, theory across scales is needed to extract physical insights and realize the data’s full scientific potential. Luckily, 3D radiation-hydrodynamics (RHD) simulations are now achieving sufficient computational capacity to capture large-scale flows in tenuous massive star envleopes. Likewise, breakthroughs in convective boundary mixing and binary interaction are on the precipice of being translated into full grids of evolutionary models. Using the 1D open-source stellar evolution code MESA in tandem with the 3D Radiation-hydrodynamics instrument Athena++, I will leverage these advances to create two vital state-of-the-art open-source suites of massive star models: one from 1D multi-physics stellar evolution, and one from 3D RHD simulations of full stellar envelopes. These models will unveil the crucial physical dependencies of large-scale convection and the final stages of stellar mass loss, create a foundation for future numerical experiments, and bear insights via comparison to the growing wealth of spatially- and temporally-resolved observations.
'''
